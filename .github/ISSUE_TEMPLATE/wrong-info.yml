name: 정보가 틀려요
description: 툴 정보(가격, 무료 한도, 학습 정책, 사용 기기 등)가 공식 페이지와 다를 때 알려주세요
title: "[정보 오류] "
labels: ["정보 오류"]
body:
  - type: markdown
    attributes:
      value: |
        알려주셔서 고마워요! 공식 페이지에서 확인한 뒤 고칠게요.
        광고·제휴 요청이나 "이 툴을 추가해 주세요" 같은 요청은 받지 않아요.
  - type: dropdown
    id: site
    attributes:
      label: 어느 사이트인가요?
      options:
        - AI 뭐 써? (일반용)
        - 개발할 때 AI 뭐 써? (개발자용)
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: 툴 이름 (또는 주소의 툴 id)
      placeholder: 예) Gamma
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇이 틀렸나요?
      description: 사이트에 나온 내용과 실제 내용을 적어 주세요
      placeholder: 예) 사이트에는 "무료 한도 확인 필요"로 나오는데, 공식 가격 페이지에는 "무료는 한 달 10장까지"라고 되어 있어요
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 근거가 있는 공식 페이지 주소
      description: 회사 공식 사이트 주소만 받아요 (블로그·리뷰 글은 근거로 쓰지 않아요)
      placeholder: https://
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 개인정보(전화번호, 회사 자료 등)를 적지 않았어요
          required: true
