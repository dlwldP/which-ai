# main에 푸시하면 테스트·데이터 검사 후 GitHub Pages에 배포한다.
# 변경 이력(data/changelog.json)은 레포에 커밋하지 않고 배포할 때 git 기록으로 만든다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: 데이터 검사
        run: |
          node scripts/validate-data.js
          node scripts/validate-dev-data.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 변경 이력을 만들려면 git 기록 전체가 필요하다
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 배포할 파일 모으기 + 변경 이력 만들기
        run: |
          mkdir _site
          cp -r index.html dev css js data _site/
          node scripts/build-changelog.js _site/data/changelog.json
          node scripts/build-changelog.js _site/data/dev/changelog.json --tools data/dev/tools.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
