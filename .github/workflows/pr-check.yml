# PR마다: 테스트·데이터 검사, 커밋 메시지·PR 본문에 작성 도구 표시가 없는지 (AGENTS.md).
# PR 본문을 고치면(edited) 다시 돈다.
name: PR check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: 데이터 검사
        run: |
          node scripts/validate-data.js
          node scripts/validate-dev-data.js
      - name: 작성 도구 표시 검사 (커밋 메시지, PR 본문)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.txt
          git log --format='%B' "$BASE..$HEAD" --no-merges > commits.txt
          node scripts/check-attribution.js pr-body.txt commits.txt
